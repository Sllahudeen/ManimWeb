<!DOCTYPE html>
<html>

<head>

    <title>{{ project.name }} | Manim Portfolio</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <script>
        window.MathJax = {
           tex: {
           inlineMath: [['\\(', '\\)']],
           displayMath: [['\\[', '\\]']]
           },
           svg: {
             fontCache: 'global'
           }
        };
    </script>
    <script defer
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>


</head>


<body>


<header>

    <h1>{{ project.name }}</h1>

    <p>
        Manim Mathematical Physics Visualization
    </p>

</header>


<main class="project-page">


    <!-- Animation -->

    <section class="project-animation">

        <h2>Animation</h2>

        <video controls autoplay muted loop>

            <source
                src="{{ url_for('static', filename='videos/' + project.video) }}"
                type="video/mp4"
            >

            Your browser does not support video playback.

        </video>

    </section>


    <!-- Description -->

    <section class="project-description">

        <h2>Description</h2>

        <div class="project-description">
             {{ project.description | safe }}
        </div>

    </section>


    <!-- Source Code -->

    <section class="project-code">

        <h2>Source Code</h2>

        <div class="code-container">

            {{ highlighted_code | safe }}

        </div>

    </section>


    <!-- Back -->

    <div class="back-button">

        <a href="{{ url_for('home') }}">
            ← Back to all projects
        </a>

    </div>


</main>


<footer>

    <p>
        Manim Portfolio
    </p>

</footer>


<script>
document.addEventListener("DOMContentLoaded", function () {
    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([
            document.querySelector(".physics-description")
        ]).catch(function (err) {
            console.error("MathJax rendering error:", err);
        });
    }
});
</script>



</body>

</html>

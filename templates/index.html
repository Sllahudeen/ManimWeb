<!DOCTYPE html>
<html>

<head>

    <title>Manim Portfolio</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

<header>

    <h1>Manim Portfolio</h1>

    <p>
        Mathematical Physics Visualizations
    </p>

</header>


<main>

    <h2>Projects</h2>


    <div class="project-list">

        {% for project in projects %}

        <a
            class="project-button"
            href="{{ url_for('project', slug=project.slug) }}"
        >
            {{ project.name }}
        </a>

        {% endfor %}

    </div>

</main>


<footer>

    <p>Manim Portfolio</p>

</footer>


</body>

</html>
